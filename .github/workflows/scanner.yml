name: Crypto Scanner

on:
  schedule:
    - cron: "0 * * * *"     # every hour — mode decided inside the job
  workflow_dispatch:
    inputs:
      mode:
        description: "Run mode: leaderboard | alerts | both"
        required: false
        default: "both"

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests pandas

      - name: Determine mode
        id: mode
        run: |
          HOUR=$(date -u +%H | sed 's/^0//')
          INPUT_MODE="${{ github.event.inputs.mode }}"
          if [ -n "$INPUT_MODE" ]; then
            echo "mode=$INPUT_MODE" >> $GITHUB_OUTPUT
          elif [ $(( ${HOUR:-0} % 4 )) -eq 0 ]; then
            echo "mode=both" >> $GITHUB_OUTPUT
          else
            echo "mode=alerts" >> $GITHUB_OUTPUT
          fi

      - name: Run scanner
        env:
          TELEGRAM_TOKEN:          ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID_LEADERBOARD:     ${{ secrets.CHAT_ID_LEADERBOARD }}
          CHAT_ID_DAY_TRADE:       ${{ secrets.CHAT_ID_DAY_TRADE }}
          CHAT_ID_SWING:           ${{ secrets.CHAT_ID_SWING }}
          CHAT_ID_HIGH_CONVICTION: ${{ secrets.CHAT_ID_HIGH_CONVICTION }}
        run: python hyperliquid_scanner.py ${{ steps.mode.outputs.mode }}

      - name: Save dedup state
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dedup.json
          git diff --cached --quiet || git commit -m "chore: update dedup state [skip ci]"
          git push
